[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sayanox-proofmesh"
version = "0.1.0"
description = "Local-first software verification and evidence engine. Don't just ship code. Prove what was verified."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Sayan Mahata", email = "sm6881164@gmail.com" },
]
keywords = [
    "verification",
    "evidence",
    "security",
    "static-analysis",
    "secrets",
    "supply-chain",
    "attestation",
    "local-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "jsonschema>=4.22.0",
    "cryptography>=42.0.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-jsonschema>=4.22.0",
]
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
proofmesh = "proofmesh.cli:app"

[project.urls]
Homepage = "https://github.com/sayan9168/sayanox-proofmesh"
Documentation = "https://github.com/sayan9168/sayanox-proofmesh/tree/main/docs"
Repository = "https://github.com/sayan9168/sayanox-proofmesh"
Issues = "https://github.com/sayan9168/sayanox-proofmesh/issues"
Changelog = "https://github.com/sayan9168/sayanox-proofmesh/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/proofmesh"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/docs",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "security: security-sensitive tests",
    "integration: integration tests requiring temporary repositories",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["proofmesh"]
