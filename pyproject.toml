[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sayanox-proofmesh"
version = "0.2.0"
description = "Local-first software verification and evidence engine. Don't just ship code. Prove what was verified."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Sayan Mahata", email = "sm6881164@gmail.com" },
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "jsonschema>=4.22.0",
]

[project.scripts]
proofmesh = "proofmesh.cli:app"

[project.urls]
Homepage = "https://github.com/sayan9168/sayanox-proofmesh"
Repository = "https://github.com/sayan9168/sayanox-proofmesh"

[tool.hatch.build]
packages = ["src/proofmesh"]

[tool.hatch.build.targets.wheel]
packages = ["src/proofmesh"]

[tool.hatch.build.targets.wheel.force-include]
"src/proofmesh" = "proofmesh"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/docs",
    "/tests",
    "/web",
    "/examples",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
