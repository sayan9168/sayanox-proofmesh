name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff typer rich cryptography jsonschema
          # Editable install; non-fatal if hatch quirks appear
          pip install -e . || true

      - name: Verify import
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -c "import proofmesh; print(proofmesh.__version__)"
          python -c "from proofmesh.policy import list_profiles; print('policy', len(list_profiles()))"
          python -c "from proofmesh.export_pkg import export_evidence_zip; print('export ok')"

      - name: Ruff lint (non-blocking)
        run: ruff check src tests || true

      - name: Unit and integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q --tb=short -x

      - name: Module smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -c "from proofmesh.cli import app; print('cli', app)"
          python -c "from proofmesh.suppressions import SuppressionSet; print('sup ok')"
          python -c "from proofmesh.checks.osv import OSVCheck; print('osv ok')"
          python -c "from proofmesh.checks.external import GitleaksCheck; print('ext ok')"
          python -c "from proofmesh.sarif import evidence_to_sarif; print('sarif ok')"

      - name: Required files present
        run: |
          test -f schemas/evidence-v1.schema.json
          test -f web/companion/index.html
          test -f web/companion/app.js
          test -f src/proofmesh/policy.py
          test -f src/proofmesh/export_pkg.py
          test -f src/proofmesh/suppressions.py
          test -f src/proofmesh/checks/osv.py
          test -f src/proofmesh/checks/external.py
