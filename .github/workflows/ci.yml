name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install typer rich pydantic jsonschema cryptography packaging pytest pytest-cov ruff
          # Install package if packaging works; otherwise rely on PYTHONPATH
          pip install -e . || true

      - name: Ruff lint (non-blocking if incomplete tree)
        run: |
          if [ -d src/proofmesh ]; then
            ruff check src tests || true
          fi

      - name: Unit and integration tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          if [ -d tests ]; then
            pytest -q --tb=short
          else
            echo "No tests directory yet"
            exit 1
          fi

      - name: CLI smoke
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          python -c "from proofmesh import __version__; print(__version__)"
          python -m proofmesh.cli version || proofmesh version || true

      - name: Schema presence
        run: test -f schemas/evidence-v1.schema.json
